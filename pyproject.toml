[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "2xbrainz"
version = "2.0.0"
description = "Docker-first continuous conversation copilot"
requires-python = ">=3.14,<3.15"
license = { text = "WTFPL" }
dependencies = [
  "fastapi==0.140.7",
  "markdown-it-py==4.0.0",
  "pydantic==2.13.4",
  "pysilero-vad==3.4.0",
  "rich==15.0.0",
  "trafilatura==2.1.0",
  "uvicorn==0.51.0",
  "websockets==15.0.1",
]

[project.scripts]
2xbrainz = "two_x_brainz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/two_x_brainz"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.403",
  "pytest==9.0.3",
  "ruff==0.11.13",
]

[tool.uv]
exclude-newer = "2026-07-29T00:00:00Z"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
