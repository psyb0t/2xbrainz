name: pipeline

on: [push]

permissions:
  contents: read

jobs:
  # code-workflow rather than python-package-workflow: the latter always runs the
  # build command and then uploads dist/ with if-no-files-found: error, and on
  # tags it publishes to PyPI. Here `make build` produces a Docker image, there
  # is no dist/ anywhere, and this project is not on PyPI.
  #
  # `make lint` and `make test` each build and run the dev image themselves; the
  # toolchain lives in that container. No coverage_file either -- see the badges
  # job. Runs on every push, including feature branches. The build below does not.
  checks:
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"

  docker:
    needs: [checks]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/2xbrainz
      # Live PipeWire capture currently supports x86_64 Linux.
      target_platforms: "linux/amd64"
      # The reusable workflow scans after publishing, so release preparation
      # also runs this gate locally before the release script is generated.
      scan_severity: "high"
      scan_fail_build: true
      scan_only_fixed: true
      scan_vex_file: security/openvex.json
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [checks, docker]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # commit the SVGs to the badges branch
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    # No `coverage: true` -- `make test-coverage` installs no coverage tooling
    # and produces no percentage file, and the badges job FAILS when coverage
    # is enabled and the file is missing. Version + license only, matching the
    # badge block in the README.
